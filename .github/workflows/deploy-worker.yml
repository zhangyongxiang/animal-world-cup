name: Build & Deploy Game Frontend
on:
  push:
    branches: ['*']
jobs:
  deploy-front:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install

      - name: Build Next Worker
        env:
          NEXT_PUBLIC_ONLINE_SERVICE_URL: https://animal-cup-online.275969940.workers.dev
          ALLOWED_ORIGINS: https://game.zoo-cup.com,https://animal-cup-online.275969940.workers.dev
        run: pnpm build:worker

      - name: Deploy Frontend Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

name: Deploy Online Room DO Service
on:
  push:
    branches: ['*']
    paths:
      - cloudflare/**
      - wrangler-online.toml
      - package.json

jobs:
  deploy-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: node-version:22
      - uses: pnpm/action-setup@v4
        with: version: latest
      - run: pnpm install

      - name: 部署公网房间DO
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALLOWED_ORIGINS: https://game.zoo-cup.com,https://animal-cup.275969940.workers.dev
        run: pnpm deploy:online

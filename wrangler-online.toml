name = "animal-cup-online"
main = "cloudflare/online-worker.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "ONLINE_ROOMS"
class_name = "OnlineRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OnlineRoom"]

[[ratelimits]]
name = "CREATE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "CONNECT_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://animal-cup-online.275969940.workers.dev,https://front.zoo-cup.com"
